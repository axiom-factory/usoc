[workspace]
authors = ["David Craven <david.craven@farsight.net>"]
channels = ["conda-forge"]
name = "usoc"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python -m unittest discover -s usoc -p 'test_*.py'"

[dependencies]
python = ">=3.14.6,<3.15"

[pypi-dependencies]
amaranth = { git = "https://github.com/amaranth-lang/amaranth", branch = "main" }
usoc = { path = ".", editable = true }
